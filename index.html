<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>

    <!-- DynaPuff Font -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital@1&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Animated background design -->
<canvas id="stars"></canvas>

    <!-- Difficulty Selection -->
    <div class="difficulty fadeIn">
        <h2>Tic Tac Toe</h2>
        <h2>Select Difficulty Level</h2>
        <button class="diff-btn" data-level="easy">Easy</button>
        <button class="diff-btn" data-level="medium">Medium</button>
        <button class="diff-btn" data-level="hard">Hard</button>
    </div>

    <!-- Player Selection -->
    <div class="selection" style="display: none;">
        <p>Select Your Player</p>
        <div class="players">
            <button class="player" onClick="playerSelect('X')">X</button>
            <button class="player" onClick="playerSelect('O')">O</button>
        </div>
    </div>

    <!-- Playing Board -->
    <div class="play-board">
        <table>
            <tr>
                <td class="cell" id="0"></td>
                <td class="cell" id="1"></td>
                <td class="cell" id="2"></td>
            </tr>
            <tr>
                <td class="cell" id="3"></td>
                <td class="cell" id="4"></td>
                <td class="cell" id="5"></td>
            </tr>
            <tr>
                <td class="cell" id="6"></td>
                <td class="cell" id="7"></td>
                <td class="cell" id="8"></td>
            </tr>
        </table>

        <!-- Reset Button -->
        <button class="reset" onclick="startGame()">Reset</button>
    </div>

    <!-- Winner Declaration -->
    <div class="winner">
        <h3></h3>
        <button class="reset" onclick="startGame()">Play Again</button>
    </div>

    <!-- JS File -->
    <script src="script.js" type="text/javascript"></script>
</body>
</html>
